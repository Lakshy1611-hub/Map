name: JARVIS Windows Build

on:
  push:
    branches:
      - "codex/jarvis-final-product"
  pull_request:
    branches:
      - main
      - "codex/jarvis-final-product"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q jarvis main.py

      - name: Unit tests
        run: python -m pytest -q

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean jarvis.spec

      - name: Upload JARVIS.exe
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: dist/JARVIS.exe
          if-no-files-found: error
